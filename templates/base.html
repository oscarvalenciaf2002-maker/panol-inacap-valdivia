{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Pañol INACAP Valdivia{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={
 theme:{extend:{
  colors:{
   inacap:'#D32F2F',
   inacap2:'#B71C1C',
   ink:'#172033',
   mist:'#F5F7FA',
   steel:'#64748B',
   line:'#E2E8F0',
   success:'#16A34A',
   warning:'#F59E0B',
   info:'#2563EB'
  },
  boxShadow:{soft:'0 8px 30px rgba(15,23,42,.07)'}
 }}
}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:Inter,system-ui,sans-serif}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:20px}
.nav-active{background:linear-gradient(90deg,#D32F2F,#B71C1C);box-shadow:0 7px 20px rgba(211,47,47,.22)}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.06)}
.input{width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:.72rem .85rem;outline:none;background:#fff}
.input:focus{border-color:#D32F2F;box-shadow:0 0 0 3px rgba(211,47,47,.10)}
.btn{border-radius:12px;padding:.72rem 1rem;font-weight:700;transition:.15s}
.btn-primary{background:#D32F2F;color:#fff}.btn-primary:hover{background:#B71C1C}
.btn-secondary{background:#fff;border:1px solid #CBD5E1}.btn-secondary:hover{background:#F8FAFC}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:.3rem .65rem;font-size:.75rem;font-weight:700}
</style>
</head>
<body class="bg-mist text-ink">
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
